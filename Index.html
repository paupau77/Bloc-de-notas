<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloc de Notas</title>
  <link rel="stylesheet" href="Styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Bloc de Notas</h1>
      <div class="header-actions">
        <button id="themeBtn" title="Cambiar tema">🌙</button>
      </div>
    </header>
    <main>
      <aside>
        <div class="note-list-header">
          <input type="text" id="searchNotes" placeholder="🔍 Buscar nota...">
          <button id="newNoteBtn" title="Nueva nota">➕</button>
        </div>
        <ul id="notesList"></ul>
      </aside>
      <section class="editor-section">
        <div class="editor-toolbar">
          <input type="text" id="noteTitle" placeholder="Título de la nota">
          <div class="editor-actions">
            <button id="saveBtn" title="Guardar (Ctrl+S)">💾</button>
            <button id="exportBtn" title="Exportar nota">⬇️</button>
            <button id="importBtn" title="Importar nota">⬆️</button>
            <input type="file" id="importFile" accept=".txt" style="display:none">
            <button id="deleteBtn" title="Eliminar nota actual">🗑️</button>
          </div>
        </div>
        <textarea id="noteArea" placeholder="¡Escribe acá tu nota!"></textarea>
        <div class="editor-footer">
          <span id="status">Listo</span>
          <span id="wordCount" title="Palabras y caracteres">0 palabras, 0 caracteres</span>
        </div>
      </section>
    </main>
    <footer>
      <span>Bloc de Notas Pau💚 ·</span>
    </footer>
  </div>
  <script src="App.js"></script>
</body>
</html>
